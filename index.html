<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cardmarket price history</title>
<script src="https://cdn.plot.ly/plotly-3.3.1.min.js" defer></script>
<style>
    :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #ffffff; color: #111827; }
    .page { width: min(1400px, 100%); margin: 0 auto; padding: 14px 14px 28px; }
    .toolbar {
        position: relative;
        z-index: 1000;
        display: grid;
        grid-template-columns: minmax(180px, 0.7fr) minmax(260px, 1.3fr);
        gap: 10px;
        margin-bottom: 10px;
        padding: 12px;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        background: #f9fafb;
    }
    .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .field label { font-size: 13px; font-weight: 650; }
    #card-search, #card-selector {
        width: 100%;
        min-height: 44px;
        border: 1px solid #cbd5e1;
        border-radius: 9px;
        background: white;
        color: #111827;
        font-size: 16px;
        padding: 9px 10px;
    }
    #card-selector { padding-right: 34px; }
    .summary {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        min-height: 24px;
        padding: 2px 4px 8px;
        font-size: 14px;
        color: #475569;
    }
    .summary strong { color: #111827; }
    #status { min-height: 22px; padding: 2px 4px; font-size: 13px; color: #64748b; }
    #price-history-chart { width: 100%; min-height: 540px; }
    @media (max-width: 700px) {
        .page { padding: 8px 6px 20px; }
        .toolbar { grid-template-columns: 1fr; gap: 8px; margin: 0 4px 8px; }
        #card-search, #card-selector { font-size: 16px; }
        .summary { margin: 0 4px; font-size: 13px; }
        #price-history-chart { min-height: 500px; }
    }
</style>
</head>
<body>
<div class="page">
    <div class="toolbar">
        <div class="field">
            <label for="card-search">Filter cards</label>
            <input id="card-search" type="search" placeholder="Type a card name…" autocomplete="off">
        </div>
        <div class="field">
            <label for="card-selector">Card</label>
            <select id="card-selector" disabled>
                <option>Loading cards…</option>
            </select>
        </div>
    </div>
    <div class="summary" id="summary"></div>
    <div id="status">Loading price-history index…</div>
    <div id="price-history-chart"></div>
</div>
<script>
window.addEventListener("DOMContentLoaded", async function () {
    const selector = document.getElementById("card-selector");
    const searchBox = document.getElementById("card-search");
    const status = document.getElementById("status");
    const summary = document.getElementById("summary");
    const graph = document.getElementById("price-history-chart");
    let manifest = null;
    let visibleCards = [];
    const cardById = new Map();
    const bucketCache = new Map();

    function euro(value) {
        if (value === null || value === undefined || Number.isNaN(Number(value))) return "—";
        return new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR" }).format(Number(value));
    }

    function populateSelector(cards, preserveId) {
        selector.innerHTML = "";
        for (const card of cards) {
            const option = document.createElement("option");
            option.value = card.card_id;
            option.textContent = card.card_name;
            selector.appendChild(option);
        }
        selector.disabled = cards.length === 0;
        if (preserveId && cards.some(card => card.card_id === preserveId)) {
            selector.value = preserveId;
        }
    }

    async function loadBucket(bucketPath) {
        if (bucketCache.has(bucketPath)) return bucketCache.get(bucketPath);
        status.textContent = "Loading selected card history…";
        const url = bucketPath + "?v=" + encodeURIComponent(manifest.generated_at);
        const response = await fetch(url, { cache: "no-store" });
        if (!response.ok) throw new Error("History request failed: HTTP " + response.status);
        const text = await response.text();
        const map = new Map();
        for (const line of text.split(/\r?\n/)) {
            if (!line.trim()) continue;
            const record = JSON.parse(line);
            map.set(record.id, record);
        }
        bucketCache.set(bucketPath, map);
        return map;
    }

    async function showCard(cardId) {
        const card = cardById.get(cardId);
        if (!card) return;
        try {
            const bucket = await loadBucket(card.bucket);
            const data = bucket.get(card.card_id);
            if (!data) throw new Error("Selected card was not present in its history bucket.");
            const x = data.t.map(value => typeof value === "number" ? new Date(value * 1000) : value);
            const traces = [
                {
                    x: x,
                    y: data.a,
                    mode: "lines+markers",
                    name: "Average first 5 offers",
                    connectgaps: false,
                    hovertemplate: "%{x}<br>Average first 5: €%{y:.2f}<extra></extra>"
                },
                {
                    x: x,
                    y: data.l,
                    mode: "lines+markers",
                    name: "Lowest offer",
                    connectgaps: false,
                    hovertemplate: "%{x}<br>Lowest offer: €%{y:.2f}<extra></extra>"
                }
            ];
            const layout = {
                title: { text: card.card_name + " — Cardmarket price history", x: 0.5 },
                xaxis: {
                    title: "Date",
                    type: "date",
                    autorange: true,
                    rangeslider: { visible: true },
                    rangeselector: {
                        buttons: [
                            { count: 1, label: "1m", step: "month", stepmode: "backward" },
                            { count: 3, label: "3m", step: "month", stepmode: "backward" },
                            { count: 6, label: "6m", step: "month", stepmode: "backward" },
                            { count: 1, label: "1y", step: "year", stepmode: "backward" },
                            { step: "all", label: "All" }
                        ]
                    }
                },
                yaxis: { title: "Price (€)", autorange: true },
                hovermode: "x unified",
                height: window.innerWidth <= 700 ? 520 : 650,
                margin: { t: 85, l: 55, r: 25, b: 65 },
                legend: { orientation: "h", yanchor: "bottom", y: 1.02, xanchor: "left", x: 0 },
                paper_bgcolor: "#ffffff",
                plot_bgcolor: "#ffffff"
            };
            await Plotly.react(graph, traces, layout, { responsive: true, displaylogo: false, scrollZoom: false });
            summary.innerHTML =
                "<span><strong>Latest average:</strong> " + euro(card.latest_average_first_5) + "</span>" +
                "<span><strong>Latest lowest:</strong> " + euro(card.latest_lowest_price) + "</span>" +
                "<span><strong>Observations:</strong> " + card.observations.toLocaleString() + "</span>";
            status.textContent = "Loaded only the history bucket required for this card.";
        } catch (error) {
            console.error(error);
            status.textContent = "Could not load this card's history: " + error.message;
        }
    }

    selector.addEventListener("change", function () { showCard(this.value); });

    searchBox.addEventListener("input", function () {
        const query = this.value.trim().toLocaleLowerCase();
        const previous = selector.value;
        visibleCards = query
            ? manifest.cards.filter(card => card.card_name.toLocaleLowerCase().includes(query))
            : manifest.cards;
        populateSelector(visibleCards, previous);
        if (selector.value && selector.value !== previous) showCard(selector.value);
    });

    window.addEventListener("orientationchange", function () {
        setTimeout(function () { if (graph.data) Plotly.Plots.resize(graph); }, 250);
    });

    try {
        if (window.location.protocol === "file:") {
            status.textContent = "This lightweight dashboard loads history files dynamically. Open the published GitHub Pages URL rather than the local HTML file.";
            return;
        }
        const response = await fetch(
            "history_manifest.json?v=" + Date.now(),
            { cache: "no-store" }
        );
        if (!response.ok) throw new Error("Manifest request failed: HTTP " + response.status);
        manifest = await response.json();
        visibleCards = manifest.cards || [];
        for (const card of visibleCards) cardById.set(card.card_id, card);
        populateSelector(visibleCards, null);
        if (!visibleCards.length) {
            status.textContent = "No cards are available yet.";
            return;
        }
        selector.value = visibleCards[0].card_id;
        await showCard(visibleCards[0].card_id);
    } catch (error) {
        console.error(error);
        status.textContent = "Could not load the dashboard index: " + error.message;
    }
});
</script>
</body>
</html>
